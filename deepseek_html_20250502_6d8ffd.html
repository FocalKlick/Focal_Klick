<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="/Focal_Klick/styles.css">
</head>
<body>
    <header>
        <h1>My Photography</h1>
        <nav>
            <ul>
                <li><a href="#nature">Nature</a></li>
                <li><a href="#travel">Travel</a></li>
                <li><a href="#portraits">Portraits</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="featured">
            <h2>Featured Photos</h2>
            <div class="gallery">
                <!-- Featured images will go here -->
            </div>
        </section>

        <section id="nature">
            <h2>Nature Photography</h2>
            <div class="gallery">
                <!-- Nature images will go here -->
            </div>
        </section>

        <section id="travel">
            <h2>Travel Photography</h2>
            <div class="gallery">
                <!-- Travel images will go here -->
            </div>
        </section>

        <section id="portraits">
            <h2>Portrait Photography</h2>
            <div class="gallery">
                <!-- Portrait images will go here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 My Photo Gallery. All rights reserved.</p>
    </footer>

    <!-- Lightbox modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div class="caption"></div>
    </div>

    <script src="/Focal_Klick/script.js"></script>
</body>
</html>
